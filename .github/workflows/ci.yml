name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 問題データの検証
        run: npm run lint:content
      - name: 型チェック
        run: |
          npm run build
          npm run typecheck
      - name: seed SQL の生成確認
        run: npm run seed:build
